<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mt. Olympus Ascent</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#FFD700;--gold2:#cc8800;--dark:#070710;--dark2:#0c0c1e;--dark3:#10102a;
  --red:#dd2200;--blue:#1155cc;--purple:#8822cc;--green:#11aa44;
  --text:#dde0f5;--muted:#5566aa;
}
html,body{background:var(--dark);color:var(--text);font-family:'Press Start 2P',monospace;
  min-height:100vh;overflow-x:hidden;}
#game{max-width:820px;margin:0 auto;padding:8px;}

/* ═══ BUTTONS ═══ */
.btn{font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 16px;
  border:2px solid var(--gold);background:transparent;color:var(--gold);
  cursor:pointer;transition:all .1s;letter-spacing:1px;}
.btn:hover{background:var(--gold);color:#000;}
.btn.primary{background:var(--gold);color:#000;}
.btn.primary:hover{background:#fff;border-color:#fff;}
.btn.red{border-color:#dd4444;color:#dd4444;}
.btn.red:hover{background:#dd4444;color:#fff;}
.btn.blue{border-color:#4488ff;color:#4488ff;}
.btn.blue:hover{background:#4488ff;color:#fff;}
.btn.green{border-color:#44ff88;color:#44ff88;}
.btn.green:hover{background:#44ff88;color:#000;}
.btn.sm{font-size:6px;padding:6px 10px;}

/* ═══ HP BAR ═══ */
.hpwrap{background:#0a0a0a;height:10px;border:1px solid #222;overflow:hidden;}
.hpbar{height:100%;transition:width .4s;}
.hpbar.hi{background:linear-gradient(90deg,#11aa44,#44ff88);}
.hpbar.med{background:linear-gradient(90deg,#bb7700,#ffcc00);}
.hpbar.low{background:linear-gradient(90deg,#aa1100,#ff3300);}

/* ═══ MANA PIPS ═══ */
.pip{display:inline-block;width:14px;height:14px;border-radius:50%;margin:2px;border:1px solid #333;}
.pip.on{background:radial-gradient(circle,#66aaff,#1155cc);border-color:#4488ff;
  box-shadow:0 0 6px #4488ff;}
.pip.off{background:#0d0d1a;}

/* ═══ CARD FRAMES — PNG-backed ═══
   130×188px with content layers positioned inside frame panels */
.card{
  width:130px;height:188px;position:relative;cursor:pointer;border-radius:5px;
  overflow:hidden;background-size:100% 100%;background-repeat:no-repeat;
  flex-shrink:0;transition:transform .18s,box-shadow .18s,filter .18s;
}
.card:hover:not(.cdis){transform:translateY(-14px) scale(1.09);
  box-shadow:0 22px 50px rgba(0,0,0,.9);}
.cdis{opacity:.38;cursor:not-allowed;}
.card.cglow{box-shadow:0 0 20px var(--gold),0 0 40px rgba(255,200,0,.4);}

/* Frame by rarity */
.r-common   {background-image:url('Wood1.png');}
.r-uncommon {background-image:url('Bronze.png');}
.r-rare     {background-image:url('Silver.png');}
.r-legendary{background-image:url('Gold.png');animation:shimmer 2.8s ease-in-out infinite;}
@keyframes shimmer{
  0%,100%{filter:brightness(1) saturate(1) drop-shadow(0 0 3px #aa7700);}
  50%    {filter:brightness(1.3) saturate(1.5) drop-shadow(0 0 16px #FFD700);}
}

/* Card name bar — sits at y:6, ABOVE art window */
.c-hdr{
  position:absolute;top:6px;left:10px;right:10px;height:17px;
  background:rgba(0,0,0,.65);display:flex;justify-content:space-between;
  align-items:center;padding:0 4px 0 5px;border-radius:2px;z-index:3;
}
.c-nm{font-size:4.8px;color:#fff;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:88px;line-height:1;}
.c-mc{
  width:16px;height:16px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:7px;font-weight:900;flex-shrink:0;
  border:1px solid rgba(255,255,255,.5);
}
.mc-atk{background:#aa1100;color:#ffc8aa;}
.mc-def{background:#114499;color:#aaccff;}
.mc-spc{background:#660099;color:#ddaaff;}
.mc-hea{background:#005522;color:#aaffcc;}
.mc-free{background:#00aa44;color:#000;}

/* Art window — inside top parchment panel y:24–102 */
.c-art{
  position:absolute;top:24px;left:10px;right:10px;height:78px;
  border-radius:2px;overflow:hidden;display:flex;align-items:center;
  justify-content:center;
}
.c-artbg{position:absolute;inset:0;opacity:.88;}
.c-artbg.atk{background:radial-gradient(ellipse at 50% 60%,#ff6622,#bb1100 55%,#440000);}
.c-artbg.def{background:radial-gradient(ellipse at 50% 60%,#44aaff,#1155bb 55%,#002255);}
.c-artbg.spc{background:radial-gradient(ellipse at 50% 60%,#cc55ff,#7711cc 55%,#220044);}
.c-artbg.hea{background:radial-gradient(ellipse at 50% 60%,#33ff88,#00aa44 55%,#002211);}
.c-emoji{font-size:34px;position:relative;z-index:1;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.75));}

/* Type strip — over the middle band y:104–118 */
.c-typ{
  position:absolute;top:104px;left:10px;right:10px;height:14px;
  background:rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:center;font-size:4px;letter-spacing:2.5px;
  text-transform:uppercase;border-radius:2px;
}
.typ-atk{color:#ff7755;}
.typ-def{color:#66aaff;}
.typ-spc{color:#cc77ff;}
.typ-hea{color:#55ff99;}

/* Text window — bottom parchment panel y:120–176 */
.c-txt{
  position:absolute;top:120px;left:18px;right:14px;bottom:12px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.c-dsc{font-size:4.5px;color:#2a1600;line-height:1.9;padding-left:2px;}
.c-rar{font-size:4px;text-align:right;margin-top:2px;}
.rar-common  {color:#6a4400;}
.rar-uncommon{color:#7a5500;}
.rar-rare    {color:#5566aa;}
.rar-legendary{color:#997700;}

/* ═══ BATTLE LAYOUT ═══ */
/* Full-width god banner at top */
.god-banner{
  width:100%;height:200px;position:relative;overflow:hidden;
  border:2px solid var(--gold);margin-bottom:8px;
}
.god-bg-vid{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.42;z-index:0;
}
.god-vignette{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.7) 100%);
}
.god-stats{
  position:absolute;bottom:0;left:0;right:0;padding:10px 12px;z-index:2;
}
.god-nameplate{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:5px;
}
.player-strip{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  background:rgba(255,255,255,.03);border:1px solid #1a1a3a;
  padding:8px;margin-bottom:8px;
}
.battle-log{
  background:#04040d;border:1px solid #111128;height:68px;overflow-y:auto;
  padding:5px 8px;font-size:5.5px;line-height:2.1;margin-bottom:8px;
}
.battle-log div{border-bottom:1px solid #0a0a14;}
.hand-row{
  display:flex;gap:7px;overflow-x:auto;padding:10px 4px 6px;
  min-height:210px;align-items:flex-end;
}
.hand-row::-webkit-scrollbar{height:4px;}
.hand-row::-webkit-scrollbar-thumb{background:var(--gold);}

/* ── SPRITE COMBAT ARENA ── */
.sprite-arena{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:8px 12px 0;height:155px;overflow:visible;
  background:linear-gradient(to top,rgba(0,0,0,.5) 0%,transparent 100%);
  position:relative;
}
.sprite-slot{
  position:relative;width:180px;height:130px;
  display:flex;align-items:flex-end;justify-content:center;overflow:visible;
}
.sprite-mover{position:relative;display:inline-block;}
.sprite{
  display:block;background-image:url('battle.png');
  background-size:960px 960px;background-repeat:no-repeat;
  image-rendering:pixelated;image-rendering:crisp-edges;
  flex-shrink:0;position:relative;z-index:2;
  transform-origin:bottom center;
}
.sp-hero{transform:scale(1.4) scaleX(-1);}
.sp-god {transform:scale(1.4);}

/* Mover translation animations */
.mv-atk-l{animation:mvLeft  .38s ease-in-out;}
.mv-atk-r{animation:mvRight .38s ease-in-out;}
@keyframes mvLeft {0%,100%{transform:translateX(0)}45%{transform:translateX(-55px)}}
@keyframes mvRight{0%,100%{transform:translateX(0)}45%{transform:translateX(55px)}}

/* Sprite color flash on hit */
.sp-hit{animation:spHit .45s ease-in-out;}
@keyframes spHit{
  0%,100%{filter:brightness(1);}
  25%{filter:brightness(3) saturate(8) hue-rotate(310deg);}
  55%{filter:brightness(2) saturate(5) hue-rotate(320deg);}
  80%{filter:brightness(1.3);}
}

/* Blood splatter fade */
@keyframes bloodFade{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1);}
  60% {opacity:.8;transform:translate(-50%,-50%) scale(1.2);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.4);}
}
.intent-bar{
  font-size:5.5px;padding:4px 10px;
  background:rgba(180,40,40,.2);border:1px solid #663333;
  color:#ee9999;display:inline-block;
}

/* ═══ TRIVIA ═══ */
.trivia-box{
  background:#06060f;border:3px solid var(--gold);
  padding:12px;margin-bottom:8px;animation:slideIn .25s ease;
}
.t-lbl{font-size:5px;color:var(--muted);margin-bottom:7px;
  text-transform:uppercase;letter-spacing:2px;}
.t-q{font-size:6.5px;color:var(--gold);line-height:2;margin-bottom:10px;}
.t-choices{display:flex;flex-direction:column;gap:5px;}
.t-btn{
  font-family:'Press Start 2P',monospace;font-size:5.5px;padding:8px 10px;
  background:#080813;border:1px solid #222240;color:#bbb;
  cursor:pointer;text-align:left;transition:all .1s;
}
.t-btn:hover{border-color:var(--gold);color:var(--gold);}
.t-btn.correct{background:#082208;border-color:#44ff88;color:#44ff88;}
.t-btn.wrong{background:#220808;border-color:#ff4444;color:#ff4444;}

/* ═══ STATUS BADGES ═══ */
.bdg{display:inline-block;font-size:4.5px;padding:2px 5px;
  border-radius:2px;margin:1px;}
.bdg-str {background:#5c1a00;color:#ffaa44;}
.bdg-weak{background:#1a3300;color:#88ff44;}
.bdg-vuln{background:#330022;color:#ff88ff;}
.bdg-psn {background:#003322;color:#44ffcc;}
.bdg-stun{background:#333300;color:#ffff44;}

/* ═══ HERO SELECT ═══ */
.hero-pick{
  border:3px solid;padding:16px 14px;cursor:pointer;
  transition:all .22s;background:var(--dark3);
  width:195px;margin:8px;text-align:center;position:relative;
  overflow:hidden;
}
.hero-pick:hover{transform:scale(1.06);}
.hero-pick.sel{transform:scale(1.08);}
.hero-pick-vid{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.22;z-index:0;pointer-events:none;
}
.hero-pick-body{position:relative;z-index:1;}

/* ═══ MAP NODES ═══ */
.gnode{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:2px solid;margin-bottom:5px;cursor:pointer;
  transition:all .18s;background:rgba(0,0,0,.3);
}
.gnode:hover:not(.glocked){transform:translateX(6px);filter:brightness(1.2);}
.gnode.gavail{animation:pulse 2s infinite;}
.gnode.glocked{border-color:#1a1a1a!important;opacity:.3;cursor:not-allowed;}
.gnode.gbeat{opacity:.65;}

/* ═══ CUTSCENE OVERLAY ═══ */
.cutscene{
  position:fixed;inset:0;background:#000;z-index:500;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;
}
.cs-vid{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.7;
}
.cs-ui{
  position:relative;z-index:1;text-align:center;
  animation:fadeInUp 1s ease .5s both;
}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}
.cs-bg{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 60%);
  z-index:0;
}

/* ═══ MISC ═══ */
.divider{color:var(--gold);font-size:7px;text-align:center;
  letter-spacing:5px;margin:10px 0;}
.label{font-size:5.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:3px;}
.sh{font-size:10px;color:var(--gold);margin-bottom:18px;text-align:center;
  text-shadow:0 0 12px var(--gold);}
.period-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
input[type="text"]{font-family:'Press Start 2P',monospace;font-size:8px;
  background:var(--dark2);border:2px solid var(--gold);color:var(--gold);
  padding:10px;width:100%;max-width:300px;}
input::placeholder{color:#3344aa;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--dark);}
::-webkit-scrollbar-thumb{background:var(--gold);}

/* ═══ ANIMATIONS ═══ */
@keyframes slideIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,215,0,.2)}50%{box-shadow:0 0 14px rgba(255,215,0,.5)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes titleGlow{
  0%,100%{text-shadow:0 0 20px var(--gold),0 0 40px var(--gold2);}
  50%    {text-shadow:0 0 35px #fff,0 0 70px var(--gold);}
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-55px)}}
.cursor{animation:blink 1s infinite;}
.fdmg{position:fixed;font-family:'Press Start 2P',monospace;font-size:14px;
  pointer-events:none;animation:floatUp 1s forwards;z-index:999;}
#musicBtn{
  position:fixed;bottom:14px;right:14px;z-index:600;
  font-family:'Press Start 2P',monospace;font-size:7px;
  padding:8px 12px;border:1px solid rgba(255,215,0,.45);
  background:rgba(5,5,20,.82);color:#FFD700;
  cursor:pointer;border-radius:4px;letter-spacing:1px;
  transition:border-color .15s,background .15s;
}
#musicBtn:hover{border-color:#FFD700;background:rgba(20,20,50,.95);}
</style>
</head>
<body>
<div id="bgLayer" style="position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;"></div>
<div id="game" style="position:relative;z-index:1;max-width:820px;margin:0 auto;padding:8px;"></div>
<button id="musicBtn" onclick="toggleMusic()" title="Toggle background music">♪ MUSIC</button>
<script>
'use strict';
const FIREBASE='https://minigolf-fd9ea-default-rtdb.firebaseio.com';

/* ═══════════════ AUDIO SYSTEM ═══════════════ */
const MUSIC=['music.mp3','music2.mp3','music3.mp3','music5.mp3'];

/* ── SPRITE SHEET: battle.png (960×960, transparent bg) ──
   Heroes: w=149, h=221, 3 cols × 4 rows, top=60
   Gods:   w=228, h=221, 2 cols × 4 rows, top=60   */
const HERO_SPRITES={
  leonidas:{x:16,  y:60,  w:149, h:221},  // row0 col0 — red tunic warrior
  percy:   {x:16,  y:723, w:149, h:221},  // row3 col0 — green adventurer
  odysseus:{x:314, y:60,  w:149, h:221},  // row0 col2 — brown traveler
};
const GOD_SPRITES={
  dionysus: {x:488, y:281, w:228, h:221},  // row1 col0 — blue elder
  artemis:  {x:716, y:502, w:228, h:221},  // row2 col1 — winged warrior
  apollo:   {x:488, y:60,  w:228, h:221},  // row0 col0 — elder w/ sparks
  aphrodite:{x:716, y:723, w:228, h:221},  // row3 col1 — golden female
  ares:     {x:488, y:502, w:228, h:221},  // row2 col0 — armored warrior
  poseidon: {x:716, y:281, w:228, h:221},  // row1 col1 — trident elder
  athena:   {x:716, y:502, w:228, h:221},  // row2 col1 — winged warrior
  hades:    {x:488, y:723, w:228, h:221},  // row3 col0 — dark armored
  zeus:     {x:716, y:60,  w:228, h:221},  // row0 col1 — red robe lightning
};

function spriteStyle(s){
  return `background-position:-${s.x}px -${s.y}px;width:${s.w}px;height:${s.h}px;`;
}

function triggerSpriteAnim(side, type){
  // type: 'attack' | 'hit'
  let moverId=side==='hero'?'heroMover':'godMover';
  let sprId  =side==='hero'?'heroSprite':'godSprite';
  let mover  =document.getElementById(moverId);
  let spr    =document.getElementById(sprId);
  if(!mover||!spr)return;
  // Remove existing classes
  mover.classList.remove('mv-atk-l','mv-atk-r');
  spr.classList.remove('sp-hit');
  void mover.offsetWidth; // force reflow
  if(type==='attack'){
    mover.classList.add(side==='hero'?'mv-atk-r':'mv-atk-l');
  } else if(type==='hit'){
    spr.classList.add('sp-hit');
    showBloodSplat(side);
  }
}

function showBloodSplat(side){
  let slot=document.getElementById(side==='hero'?'heroSlot':'godSlot');
  if(!slot)return;
  let dots='';
  for(let i=0;i<16;i++){
    let angle=Math.random()*Math.PI*2;
    let dist=8+rnd(0,38);
    let bx=(50+Math.cos(angle)*dist).toFixed(1);
    let by=(50+Math.sin(angle)*dist).toFixed(1);
    let r=rnd(2,7);
    let op=(0.55+Math.random()*.45).toFixed(2);
    dots+=`<circle cx="${bx}" cy="${by}" r="${r}" fill="#cc0000" opacity="${op}"/>`;
    if(Math.random()>.5){
      let bx2=(50+Math.cos(angle)*(dist*1.35)).toFixed(1);
      let by2=(50+Math.sin(angle)*(dist*1.35)).toFixed(1);
      dots+=`<circle cx="${bx2}" cy="${by2}" r="${(r*.55).toFixed(1)}" fill="#880000" opacity="${(op*.75).toFixed(2)}"/>`;
    }
  }
  let svg=document.createElement('div');
  svg.style.cssText='position:absolute;top:50%;left:50%;pointer-events:none;z-index:20;';
  svg.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110"
    style="animation:bloodFade .65s forwards;position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);">${dots}</svg>`;
  slot.appendChild(svg);
  setTimeout(()=>svg.remove(), 700);
}
// Battle-ready backgrounds (exact filenames from zip)
const BGVIDS=['background1.mp4','background2.mp4','background3.mp4',
              'background4.mp4','background5.mp4','background6.mp4','backgounrd7.mp4'];
const WIN_VIDS=['win1.mp4','win2.mp4','win3.mp4','win4.mp4','win5.mp4'];
const LOSE_VIDS=['lose1.mp4','lose2.mp4','lose3.mp4','lose4.mp4','lose5.mp4'];
const SFX_MAP={
  cardPlay:  ['card-slide-1.ogg','card-slide-2.ogg','card-slide-4.ogg'],
  cardDraw:  ['card-place-1.ogg','card-place-2.ogg'],
  shuffle:   'card-shuffle.ogg',
  click:     ['click1.ogg','click2.ogg','click3.ogg'],
  hover:     ['rollover1.ogg','rollover2.ogg','rollover3.ogg'],
  correct:   'switch22.ogg',
  wrong:     'switch36.ogg',
  damage:    ['chip-lay-1.ogg','chip-lay-2.ogg','chip-lay-3.ogg'],
  victory:   'cards-pack-open-1.ogg',
  fight:     'dice-shake-1.ogg',
  deal:      'card-fan-1.ogg',
};
let _musicEl=null, _musicIdx=-1, _audioOn=false, _bgIdx=0, _musicMuted=false;

function initAudio(){
  if(_audioOn)return;
  _audioOn=true;
  _musicEl=new Audio();
  _musicEl.volume=0.35;
  _musicEl.addEventListener('ended',()=>{
    let step=MUSIC.length>1?1+rnd(0,MUSIC.length-2):0;
    _musicIdx=(_musicIdx+step)%MUSIC.length;
    _musicEl.src=MUSIC[_musicIdx];_musicEl.play().catch(()=>{});
  });
  _musicIdx=rnd(0,MUSIC.length-1);
  _musicEl.src=MUSIC[_musicIdx];
  _musicEl.play().catch(()=>{});
}

function toggleMusic(){
  if(!_audioOn){initAudio();return;}
  _musicMuted=!_musicMuted;
  if(_musicEl)_musicEl.volume=_musicMuted?0:0.35;
  let btn=document.getElementById('musicBtn');
  if(btn)btn.textContent=_musicMuted?'✕ MUSIC':'♪ MUSIC';
}

function sfx(key){
  if(!_audioOn)return;
  let s=SFX_MAP[key];if(!s)return;
  if(Array.isArray(s))s=s[rnd(0,s.length-1)];
  let a=new Audio(s);a.volume=0.65;a.play().catch(()=>{});
}

function pickBg(exclude){
  let choices=BGVIDS.filter((_,i)=>i!==exclude);
  return choices[rnd(0,choices.length-1)];
}
// Each screen gets a stable random bg for its session
let _titleBg=BGVIDS[rnd(0,BGVIDS.length-1)];
let _mapBg=pickBg(BGVIDS.indexOf(_titleBg));

function setBgVideo(src, opacity){
  let layer=document.getElementById('bgLayer');
  if(!layer)return;
  if(!src){layer.innerHTML='';return;}
  layer.innerHTML=`<video style="width:100%;height:100%;object-fit:cover;opacity:${opacity||0.25};"
    autoplay loop muted playsinline>
    <source src="${src}" type="video/mp4">
  </video>`;
}
// legacy alias kept for safety
function bgVidHTML(){return'';}

/* ═══════════════ CARD LIBRARY ═══════════════ */

/* ═══════════════ UTILS ═══════════════ */
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=rnd(0,i);[b[i],b[j]]=[b[j],b[i]];}return b;}
function pickN(a,n){return shuffle(a).slice(0,n);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function hpc(p){return p<30?'low':p<60?'med':'hi';}
function alog(msg,c='#aabbcc'){G.log.unshift({msg,c});if(G.log.length>25)G.log.pop();}
function fdmg(msg,c='#ff4444'){
  let e=document.createElement('div');e.className='fdmg';
  e.textContent=msg;e.style.color=c;
  e.style.left=rnd(220,480)+'px';e.style.top=rnd(120,200)+'px';
  document.body.appendChild(e);setTimeout(()=>e.remove(),950);
}

/* ═══════════════ FIREBASE ═══════════════ */
// 4-second timeout — school networks silently drop blocked domains instead of rejecting
async function fbFetch(url, opts){
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),4000);
  try{
    let r=await fetch(url,{...opts,signal:ctrl.signal});
    clearTimeout(tid);
    return r;
  }catch{clearTimeout(tid);return null;}
}
async function fbGet(p){try{let r=await fbFetch(FIREBASE+p+'.json');return r?await r.json():null;}catch{return null;}}
async function fbSet(p,d){try{await fbFetch(FIREBASE+p+'.json',{method:'PUT',body:JSON.stringify(d)});}catch{}}
async function fbPush(p,d){try{let r=await fbFetch(FIREBASE+p+'.json',{method:'POST',body:JSON.stringify(d)});return r?await r.json():null;}catch{return null;}}

async function saveDeck(){
  if(!G.playerName||!G.hero)return;
  let k=G.playerName.replace(/\s+/g,'_').toLowerCase();
  await fbSet('/olympus_decks/'+k,{hero:G.hero.id,deck:G.deck,defeatedGods:G.defeatedGods,
    period:G.period,hp:G.hp,maxHP:G.maxHP,maxMana:G.maxMana,savedAt:Date.now()});
}
async function loadSave(){
  if(!G.playerName)return false;
  let k=G.playerName.replace(/\s+/g,'_').toLowerCase();
  let d=await fbGet('/olympus_decks/'+k);
  if(d&&d.hero){
    G.hero=HEROES.find(h=>h.id===d.hero);
    if(!G.hero)return false;
    G.deck=d.deck||[...G.hero.starterDeck];
    G.defeatedGods=d.defeatedGods||[];
    G.period=d.period||G.period;
    G.hp=d.hp||G.hero.maxHP;
    G.maxHP=d.maxHP||G.hero.maxHP;
    G.maxMana=d.maxMana||3;
    return true;
  }
  return false;
}
async function recordWin(godId){
  if(!G.playerName||!G.period)return;
  await fbPush('/olympus_scores/'+godId+'/'+G.period,
    {name:G.playerName,period:G.period,turns:G.turnCount,hp:G.hp,timestamp:Date.now()});
}
async function getBoard(godId){
  let d=await fbGet('/olympus_scores/'+godId+'/'+G.period);
  let entries=d?Object.values(d):[];
  // Merge local cache — guarantees the just-completed score appears immediately
  // even if Firebase write hasn't propagated yet
  if(G.lastScore&&G.lastScoreGod===godId&&G.lastScore.period===G.period){
    if(!entries.some(e=>e.timestamp===G.lastScore.timestamp)){
      entries.push(G.lastScore);
    }
  }
  return entries.sort((a,b)=>a.turns-b.turns).slice(0,10);
}

/* ═══════════════ BATTLE LOGIC ═══════════════ */
function dealDmg(amt,pierce=false){
  triggerSpriteAnim('hero','attack');
  setTimeout(()=>triggerSpriteAnim('god','hit'),200);
  let god=GODS[G.currentGodIdx];
  let d=amt+G.strength;
  if(G.pWeak>0)d=Math.floor(d*0.75);
  if(!pierce){
    let b=Math.min(G.godBlock,d);G.godBlock=Math.max(0,G.godBlock-d);
    d=Math.max(0,d-b);if(b>0)alog('Blocked '+b+' dmg!','#4488ff');
  }else alog('Pierce! Ignores block!','#FFD700');
  G.godHP=Math.max(0,G.godHP-d);
  if(d>0){alog('You deal '+d+' to '+god.name+'!','#ffaa44');fdmg('-'+d,'#ffaa44');sfx('damage');}
}
function gainBlk(n){G.block+=n;alog('You gain '+n+' block.','#4488ff');}
function healHP(n){G.hp=clamp(G.hp+n,0,G.maxHP);alog('You heal '+n+' HP.','#44ff88');}
function gWk(n){G.gWeak=Math.max(G.gWeak,n);alog(GODS[G.currentGodIdx].name+' is Weakened!','#aaff44');}
function gVl(n){G.gVuln=Math.max(G.gVuln,n);alog(GODS[G.currentGodIdx].name+' is Vulnerable!','#ff88ff');}
function gPs(n){G.gPoison+=n;alog(GODS[G.currentGodIdx].name+' poisoned +'+n+'!','#44ffcc');}
function gSt(n){G.gStun=Math.max(G.gStun,n);alog(GODS[G.currentGodIdx].name+' is Stunned!','#ffff44');}

function playCard(id,i){
  if(G.phase!=='play')return;
  let c=CARDS[id];if(!c)return;
  let cost=Math.max(0,c.cost-G.costReduce);
  if(G.doubleNext)cost=0;
  if(G.mana<cost){alog('Not enough mana!','#ff4444');return;}
  G.mana-=cost;G.hand.splice(i,1);G.discard.push(id);
  let m=G.doubleNext?2:1;G.doubleNext=false;
  alog('Playing '+c.name+'!','#FFD700');sfx('cardPlay');
  switch(c.et){
    case 'damage':          dealDmg(c.ev*m);break;
    case 'damage_pierce':   dealDmg(c.ev*m,true);break;
    case 'block':           gainBlk(c.ev*m);break;
    case 'heal':            healHP(c.ev*m);break;
    case 'draw':            drawCards(c.ev);break;
    case 'mana_gain':       G.mana=clamp(G.mana+c.ev,0,10);alog('+'+c.ev+' mana!','#4488ff');break;
    case 'strength':        G.strength+=c.ev;alog('+'+c.ev+' Strength!','#ff8800');break;
    case 'damage_weak':     dealDmg(c.ev[0]*m);gWk(c.ev[1]);break;
    case 'damage_vuln':     dealDmg(c.ev[0]*m);gVl(c.ev[1]);break;
    case 'damage_poison':   dealDmg(c.ev[0]*m);gPs(c.ev[1]);break;
    case 'damage_stun':     dealDmg(c.ev[0]*m);gSt(c.ev[1]);break;
    case 'damage_heal':     dealDmg(c.ev[0]*m);healHP(c.ev[1]);break;
    case 'damage_strength': dealDmg(c.ev[0]*m);G.strength+=c.ev[1];alog('+'+c.ev[1]+' Strength!','#ff8800');break;
    case 'multi_damage':    for(let x=0;x<c.ev[1];x++)dealDmg(c.ev[0]*m);break;
    case 'block_thorns':    gainBlk(c.ev[0]*m);G.blockThorns+=c.ev[1];alog('Thorns: '+c.ev[1]+' reflect!','#ff8800');break;
    case 'block_mana':      gainBlk(c.ev[0]*m);G.mana=clamp(G.mana+c.ev[1],0,10);alog('+'+c.ev[1]+' mana!','#4488ff');break;
    case 'block_strength':  gainBlk(c.ev[0]*m);G.strength+=c.ev[1];alog('+'+c.ev[1]+' Strength!','#ff8800');break;
    case 'shield_bash':     dealDmg(G.block*m);break;
    case 'last_stand':      if(G.hp/G.maxHP<0.3)gainBlk(c.ev);else alog('HP not low enough!','#ff4444');break;
    case 'double_next':     G.doubleNext=true;alog('Next card: FREE + DOUBLED!','#FFD700');break;
    case 'cost_reduce':     G.costReduce=c.ev;alog('Cards cost '+c.ev+' less this turn!','#FFD700');break;
    case 'random':          randEffect();break;
    case 'random_damage':   dealDmg(rnd(c.ev[0],c.ev[1])*m);break;
    case 'heal_cleanse':    healHP(c.ev);G.pWeak=0;G.pVuln=0;alog('Debuffs removed!','#44ff88');break;
    case 'mana_next':       G.bonusMana+=c.ev;alog('+'+c.ev+' mana next turn!','#4488ff');break;
    // ── NEW EFFECT TYPES ──
    case 'damage_draw':     dealDmg(c.ev[0]*m);drawCards(c.ev[1]);break;
    case 'draw_mana':       drawCards(c.ev[0]);G.mana=clamp(G.mana+c.ev[1],0,10);alog('+'+c.ev[1]+' mana!','#4488ff');break;
    case 'str_draw':        G.strength+=c.ev[0];drawCards(c.ev[1]);alog('+'+c.ev[0]+' Str + draw '+c.ev[1]+'!','#ff8800');break;
    case 'heal_mana':       healHP(c.ev[0]);G.mana=clamp(G.mana+c.ev[1],0,10);alog('Healed + mana!','#44ff88');break;
    case 'stun_weak':       gSt(c.ev);gWk(c.ev);alog('Enemy Stunned + Weakened!','#ffff44');break;
    case 'double_debuff':   gWk(c.ev);gVl(c.ev);alog('Enemy Weakened + Vulnerable!','#ff88ff');break;
    case 'sacrifice':
      G.hp=Math.max(1,G.hp-c.ev[0]);alog('You sacrifice '+c.ev[0]+' HP!','#ff8844');
      dealDmg(c.ev[1]*m);break;
    case 'execute':
      let exDmg=(G.godHP/G.godMaxHP*100)<c.ev[2]?c.ev[1]:c.ev[0];
      alog(exDmg===c.ev[1]?'⚔️ EXECUTE!':'Execute ready below '+c.ev[2]+'% HP.','#FFD700');
      dealDmg(exDmg*m);break;
    case 'coin_flip':
      if(rnd(0,1)){dealDmg(c.ev*m);alog('🪙 HEADS — '+c.ev+' damage!','#FFD700');}
      else{healHP(c.ev);alog('🪙 TAILS — Heal '+c.ev+'!','#44ff88');}break;
    case 'overdrive':
      G.hp=Math.max(1,G.hp-c.ev[0]);
      G.strength+=c.ev[1];G.mana=clamp(G.mana+c.ev[2],0,10);
      alog('Overdrive! +'+c.ev[1]+' Str, +'+c.ev[2]+' mana!','#FFD700');break;
    case 'quake':
      G.hp=Math.max(1,G.hp-c.ev[0]);alog('Quake costs '+c.ev[0]+' HP!','#ff8844');
      dealDmg(c.ev[1]*m);gVl(2);break;
    case 'damage_cleanse':
      dealDmg(c.ev*m);G.pWeak=0;G.pVuln=0;alog('Attack + debuffs removed!','#44ff88');break;
  }
  render();checkBattleEnd();
}

function randEffect(){
  let fx=[
    ()=>{dealDmg(15);alog('RANDOM: 15 damage!','#FFD700');},
    ()=>{healHP(15);alog('RANDOM: Heal 15!','#FFD700');},
    ()=>{gainBlk(12);alog('RANDOM: 12 block!','#FFD700');},
    ()=>{gVl(2);gWk(2);alog('RANDOM: Vuln + Weak!','#FFD700');},
    ()=>{G.strength+=4;alog('RANDOM: +4 Strength!','#FFD700');},
    ()=>{drawCards(3);alog('RANDOM: Draw 3!','#FFD700');},
    ()=>{G.gPoison+=5;alog('RANDOM: 5 Poison!','#FFD700');},
    ()=>{gSt(1);alog('RANDOM: Stun!','#FFD700');},
  ];
  fx[rnd(0,fx.length-1)]();
}

function drawCards(n){
  for(let i=0;i<n;i++){
    if(G.deck.length===0){
      G.deck=shuffle(G.discard);G.discard=[];
      if(G.deck.length===0)break;
      alog('Deck reshuffled.','#444466');
    }
    G.hand.push(G.deck.shift());
  }
}

function startPlayerTurn(){
  G.block=0;G.blockThorns=0;G.costReduce=0;
  G.mana=clamp(G.maxMana+G.bonusMana,0,10);G.bonusMana=0;
  G.phase='trivia';
  if(G.pPoison>0){let p=G.pPoison;G.hp=Math.max(0,G.hp-p);
    alog('Poison: -'+p+' HP!','#44ffcc');G.pPoison=Math.max(0,G.pPoison-1);}
  if(G.pWeak>0)G.pWeak--;
  if(G.pVuln>0)G.pVuln--;
  G.discard.push(...G.hand);  // return unplayed cards — critical on wrong trivia answers
  G.hand=[];drawCards(5);sfx('cardDraw');G.turnCount++;
  G.triviaQ=TRIVIA[rnd(0,TRIVIA.length-1)];
  G.triviaAnswered=false;render();
}

function endPlayerTurn(){
  G.phase='enemy';G.discard.push(...G.hand);G.hand=[];
  render();setTimeout(enemyTurn,900);
}

function enemyTurn(){
  let god=GODS[G.currentGodIdx];
  if(G.gPoison>0){let p=G.gPoison;G.godHP=Math.max(0,G.godHP-p);
    alog(god.name+' poison: -'+p,'#44ffcc');G.gPoison=Math.max(0,G.gPoison-1);
    if(G.godHP<=0){checkBattleEnd();return;}}
  if(G.gWeak>0)G.gWeak--;
  if(G.gVuln>0)G.gVuln--;
  if(G.gStun>0){G.gStun--;alog(god.name+' stunned! Skips turn.','#ffff44');
    setTimeout(startPlayerTurn,500);return;}
  G.godBlock=0;
  let action=god.pattern[G.godPatternIdx%god.pattern.length];G.godPatternIdx++;
  let atk=rnd(god.atk[0],god.atk[god.atk.length-1]);
  switch(action){
    case 'attack':        gAtk(atk,god);break;
    case 'strong_attack': gAtk(god.strongAtk||atk+5,god);break;
    case 'block':         G.godBlock=god.blockAmt||8;alog(god.name+' gains '+(god.blockAmt||8)+' block!','#4488ff');break;
    case 'debuff':        G.pWeak=Math.max(G.pWeak,2);alog(god.name+' weakens you!','#aaff44');break;
    case 'charm':         gAtk(god.charmDmg||5,god);G.bonusMana-=1;alog(god.name+' charms you! -1 mana next turn.','#ff88ff');break;
    case 'berserk':       gAtk(god.berserkDmg||20,god);break;
    case 'tidal_wave':    gAtk(god.tidalDmg||17,god);G.pVuln=Math.max(G.pVuln,2);alog('Tidal wave! Vulnerable!','#ff88ff');break;
    case 'counter':       gAtk(god.counterDmg||9,god);break;
    case 'heal':          let hh=god.healAmt||10;G.godHP=clamp(G.godHP+hh,0,G.godMaxHP);alog(god.name+' heals '+hh+'!','#44ff88');break;
    case 'drain':         gAtk(god.drainAmt||9,god);G.godHP=clamp(G.godHP+Math.floor((god.drainAmt||9)/2),0,G.godMaxHP);alog(god.name+' drains life!','#aa44ff');break;
    case 'summon':        gAtk(atk,god);G.godHP=clamp(G.godHP+10,0,G.godMaxHP);alog(god.name+' summons help!','#ff8800');break;
    case 'lightning':     gAtk(god.lightDmg||22,god);alog('⚡ LIGHTNING!','#FFD700');break;
    case 'storm':         gAtk(god.stormDmg||30,god);alog('⛈️ THE STORM OF ZEUS!','#FFD700');break;
  }
  setTimeout(()=>{if(G.hp<=0)checkBattleEnd();else startPlayerTurn();},700);
}

function gAtk(dmg,god){
  triggerSpriteAnim('god','attack');
  setTimeout(()=>triggerSpriteAnim('hero','hit'),200);
  let d=dmg;
  if(G.gWeak>0)d=Math.floor(d*0.75);
  if(G.pVuln>0)d=Math.floor(d*1.5);
  let b=Math.min(G.block,d);G.block=Math.max(0,G.block-d);let hit=Math.max(0,d-b);
  if(b>0&&G.blockThorns>0){G.godHP=Math.max(0,G.godHP-G.blockThorns);
    alog('Thorns: '+G.blockThorns+' reflected!','#ff8800');}
  G.hp=Math.max(0,G.hp-hit);
  if(b>0)alog('Block absorbs '+b+'!','#4488ff');
  alog(god.name+' hits for '+hit+'!','#ff4444');fdmg('-'+hit,'#ff4444');render();
}

function getIntent(){
  let god=GODS[G.currentGodIdx];
  let a=god.pattern[G.godPatternIdx%god.pattern.length];
  switch(a){
    case 'attack':        return '⚔️ Attack: ~'+god.atk[1];
    case 'strong_attack': return '💥 Strong Atk: '+(god.strongAtk||god.atk[2]+3);
    case 'block':         return '🛡️ Blocking: +'+(god.blockAmt||8);
    case 'debuff':        return '💚 Weaken you';
    case 'charm':         return '💖 Charm + Atk';
    case 'berserk':       return '😡 BERSERK: '+(god.berserkDmg||20);
    case 'tidal_wave':    return '🌊 Tidal Wave: '+(god.tidalDmg||17);
    case 'counter':       return '🔄 Counter: '+(god.counterDmg||9);
    case 'heal':          return '💚 Healing: +'+(god.healAmt||10);
    case 'drain':         return '🩸 Life Drain: '+(god.drainAmt||9);
    case 'summon':        return '📯 Summoning';
    case 'lightning':     return '⚡ Lightning: '+(god.lightDmg||22);
    case 'storm':         return '⛈️ STORM: '+(god.stormDmg||30);
    default:              return '❓ ???';
  }
}

/* ─── WIN / LOSE CUTSCENES ─── */
let _resultCB=null,_resultTimer=null;

function showResultCutscene(vids,title,titleColor,subtitle,cb){
  // Pause music slightly during cutscene
  if(_musicEl){_musicEl.volume=0.1;}
  _resultCB=cb;
  // Remove any stale result overlay
  let stale=document.getElementById('resultCS');if(stale)stale.remove();
  let src=vids[rnd(0,vids.length-1)];
  let el=document.createElement('div');
  el.className='cutscene';el.id='resultCS';
  el.innerHTML=`
    <video id="resultVid" playsinline
      style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
      <source src="${src}" type="video/mp4">
    </video>
    <div class="cs-bg"></div>
    <div style="position:absolute;top:24px;left:0;right:0;text-align:center;z-index:2;
      animation:fadeInUp .6s ease;">
      <div style="font-size:15px;color:${titleColor};letter-spacing:3px;
        text-shadow:0 0 20px ${titleColor},0 0 50px ${titleColor};
        animation:titleGlow 1.2s infinite;">${title}</div>
      <div style="font-size:6px;color:#aaa;margin-top:8px;letter-spacing:2px;">${subtitle}</div>
    </div>
    <div style="position:absolute;bottom:28px;left:0;right:0;text-align:center;z-index:2;">
      <button class="btn sm" onclick="proceedResult()" style="opacity:.7;font-size:7px;">
        SKIP ▶▶
      </button>
    </div>`;
  document.body.appendChild(el);
  // Explicit .play() AND wire ended event after DOM insertion
  let vid=document.getElementById('resultVid');
  if(vid){vid.play().catch(()=>{});vid.addEventListener('ended',proceedResult);}
  // Safety fallback — max 12 seconds
  _resultTimer=setTimeout(proceedResult,12000);
}

function proceedResult(){
  clearTimeout(_resultTimer);
  // Restore music volume
  if(_musicEl)_musicEl.volume=_musicMuted?0:0.35;
  let el=document.getElementById('resultCS');
  if(el)el.remove();
  if(_resultCB){let cb=_resultCB;_resultCB=null;cb();}
}

function checkBattleEnd(){
  if(G.godHP<=0){
    let god=GODS[G.currentGodIdx];
    alog('🏆 '+god.name.toUpperCase()+' DEFEATED!','#FFD700');sfx('victory');
    if(!G.defeatedGods.includes(god.id))G.defeatedGods.push(god.id);
    // Cache score locally FIRST for instant leaderboard display, then write to Firebase
    G.lastScore={name:G.playerName,period:G.period,turns:G.turnCount,hp:G.hp,timestamp:Date.now()};
    G.lastScoreGod=god.id;
    recordWin(god.id);
    let pool=[god.reward,...god.extras,...getRewardPool()];
    pool=[...new Set(pool)].filter(id=>id&&CARDS[id]);
    G.cardRewards=pickN(pool,3);G.rewardPhase='pick';
    saveDeck();
    let nextScreen=G.currentGodIdx===GODS.length-1?'victory':'card_reward';
    showResultCutscene(WIN_VIDS,'⚡ VICTORY! ⚡','#FFD700',
      god.name.toUpperCase()+' HAS FALLEN',
      ()=>{G.screen=nextScreen;render();});
    return;
  }
  if(G.hp<=0){
    showResultCutscene(LOSE_VIDS,'💀 DEFEATED 💀','#dd3300',
      'THE GODS OF OLYMPUS PREVAIL',
      ()=>{G.screen='game_over';render();});
  }
}

function getRewardPool(){
  return pickN(Object.keys(CARDS).filter(id=>CARDS[id].rarity!=='common'||Math.random()<0.3),8);
}

function beginFight(idx){
  let cs=document.getElementById('godCS');if(cs)cs.remove();
  startBattle(idx);
}

function startBattle(idx){
  let god=GODS[idx];
  G.currentGodIdx=idx;
  // BUG FIX: set maxHP FIRST so the hp clamp is correct
  G.maxHP=G.hero.maxHP;
  G.hp=clamp(G.hp>0?G.hp:G.maxHP,1,G.maxHP);
  G.block=0;G.strength=0;G.mana=G.maxMana;G.bonusMana=0;
  G.blockThorns=0;G.costReduce=0;G.doubleNext=false;
  G.pWeak=0;G.pVuln=0;G.pPoison=0;
  G.godHP=god.maxHP;G.godMaxHP=god.maxHP;G.godBlock=0;
  G.gWeak=0;G.gVuln=0;G.gStun=0;G.gPoison=0;G.godPatternIdx=0;
  G.turnCount=0;G.log=[];
  // BUG FIX: recombine all card piles before shuffle — hand+discard are NOT lost on retry
  let allCards=[...G.deck,...G.hand,...G.discard];
  G.deck=shuffle(allCards);G.hand=[];G.discard=[];
  G.screen='battle';drawCards(5);
  G.triviaQ=TRIVIA[rnd(0,TRIVIA.length-1)];
  G.triviaAnswered=false;G.phase='trivia';render();
}

/* ═══════════════ CARD RENDER HELPERS ═══════════════ */
function artClass(t){return{attack:'atk',defense:'def',special:'spc',healing:'hea'}[t]||'atk';}
function mcClass(t,cost){
  if(cost===0)return'mc-free';
  return{attack:'mc-atk',defense:'mc-def',special:'mc-spc',healing:'mc-hea'}[t]||'mc-atk';
}
function typClass(t){return{attack:'typ-atk',defense:'typ-def',special:'typ-spc',healing:'typ-hea'}[t]||'typ-atk';}
function rarClass(r){return'rar-'+r;}
function rarLabel(r){return{common:'◆ COMMON',uncommon:'◆ UNCOMMON',rare:'◇ RARE',legendary:'★ LEGENDARY'}[r]||r;}

function mkCard(id, onclick, extra=''){
  let c=CARDS[id];if(!c)return'';
  return`<div class="card r-${c.rarity}${extra}" onclick="${onclick}">
    <div class="c-hdr">
      <span class="c-nm">${c.name}</span>
      <span class="c-mc ${mcClass(c.type,c.cost)}">${c.cost}</span>
    </div>
    <div class="c-art">
      <div class="c-artbg ${artClass(c.type)}"></div>
      <span class="c-emoji">${c.art}</span>
    </div>
    <div class="c-typ ${typClass(c.type)}">${c.type.toUpperCase()}</div>
    <div class="c-txt">
      <div class="c-dsc">${c.desc}</div>
      <div class="c-rar ${rarClass(c.rarity)}">${rarLabel(c.rarity)}</div>
    </div>
  </div>`;
}

function mkHandCard(id, i){
  let c=CARDS[id];if(!c)return'';
  let cost=Math.max(0,c.cost-G.costReduce);
  if(G.doubleNext)cost=0;
  let canPlay=G.mana>=cost;
  let glow=G.doubleNext&&canPlay?' cglow':'';
  let dis=canPlay?'':'cdis';
  // Override displayed cost in header
  return`<div class="card r-${c.rarity} ${dis}${glow}" onclick="${canPlay?`playCard('${id}',${i})`:''}">
    <div class="c-hdr">
      <span class="c-nm">${c.name}</span>
      <span class="c-mc ${mcClass(c.type,cost)}" style="${cost===0?'background:#00aa44;color:#000;':''}">${cost}</span>
    </div>
    <div class="c-art">
      <div class="c-artbg ${artClass(c.type)}"></div>
      <span class="c-emoji">${c.art}</span>
    </div>
    <div class="c-typ ${typClass(c.type)}">${c.type.toUpperCase()}</div>
    <div class="c-txt">
      <div class="c-dsc">${c.desc}</div>
      <div class="c-rar ${rarClass(c.rarity)}">${rarLabel(c.rarity)}</div>
    </div>
  </div>`;
}

function finishHeroSelect(){

function renderTrivia(){

  }
  return`<div class="trivia-box">

    <div class="t-q">${q.q}</div>
    <div class="t-choices">
      ${q.c.map((ch,i)=>`
        <button class="t-btn" id="tc${i}" onclick="answerTrivia(${i})">
          ${['A','B','C','D'][i]}) ${ch}
        </button>`).join('')}
    </div>
    <div style="font-size:5px;color:#222240;margin-top:8px;text-align:right;">

function renderPlay(){
  return`<div>
    <div style="font-size:6px;color:#44ff88;text-align:center;margin-bottom:4px;">
      YOUR TURN — ${G.mana} mana left
      ${G.costReduce>0?'(cards -'+G.costReduce+' cost)':''}
    </div>
    <div class="hand-row">
      ${G.hand.map((id,i)=>mkHandCard(id,i)).join('')}

    <div style="text-align:center;margin-top:6px;">
      <button class="btn red" onclick="endPlayerTurn()">END TURN ⏭️</button>
    </div>
  </div>`;
}

function answerTrivia(i){
  let q=G.triviaQ;
  let btns=document.querySelectorAll('.t-btn');
  btns.forEach(b=>b.style.pointerEvents='none');
  if(i===q.a){
    if(btns[i])btns[i].classList.add('correct');
    G.triviaAnswered=true;sfx('correct');alog('✅ Correct! Take your turn.','#44ff88');
    setTimeout(()=>{G.phase='play';render();},700);
  }else{
    if(btns[i])btns[i].classList.add('wrong');
    if(btns[q.a])btns[q.a].classList.add('correct');
    sfx('wrong');alog('❌ Wrong! '+q.c[q.a]+' was correct. Losing turn!','#ff4444');
    setTimeout(()=>{G.phase='enemy';render();setTimeout(enemyTurn,1000);},1600);
  }
}

      Loading...
    </div>
    <div style="text-align:center;margin-top:16px;">
      <button class="btn" onclick="G.screen='title';render();">◀ BACK</button>
    </div>
  </div>`;
  let entries=await getBoard(god.id);
  let el=document.getElementById('lbContent');if(!el)return;
  if(!entries.length){
    el.innerHTML='<div style="color:#1a1a33;">No scores yet. Be the first!</div>';return;
  }
  el.innerHTML=`
  <table style="width:100%;border-collapse:collapse;font-size:5.5px;">
    <tr style="color:var(--gold);border-bottom:1px solid #111;">
      <td style="padding:5px;text-align:left;">Rank</td>
      <td style="padding:5px;text-align:left;">Name</td>
      <td style="padding:5px;text-align:center;">Turns</td>
      <td style="padding:5px;text-align:center;">HP Left</td>
    </tr>
    ${entries.map((e,i)=>`
      <tr style="border-bottom:1px solid #0a0a0f;
        color:${e.name===G.playerName?'var(--gold)':'#667799'};">
        <td style="padding:5px;text-align:left;">${['🥇','🥈','🥉'][i]||'#'+(i+1)}</td>
        <td style="padding:5px;text-align:left;">${e.name}</td>
        <td style="padding:5px;text-align:center;">${e.turns}</td>
        <td style="padding:5px;text-align:center;color:#44ff88;">${e.hp}</td>
      </tr>`).join('')}
  </table>`;
}

render();
</script>
</body>
</html>
